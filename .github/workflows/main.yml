name: Unity WebGL Build & Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:

  build:

    runs-on:
      - self-hosted
      - unity
      - webgl

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**','Packages/**','ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Build WebGL
        shell: cmd
        run: |
          "C:\Program Files\Unity\Hub\Editor\6000.5.4f1\Editor\Unity.exe" ^
          -batchmode ^
          -quit ^
          -nographics ^
          -projectPath "%GITHUB_WORKSPACE%" ^
          -executeMethod MoonRabbitRush.Editor.BuildPipeline.BuildScript.BuildWebGL

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Build/WebGL

  deploy:

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
